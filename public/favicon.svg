<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a5a40"/>
      <stop offset="100%" stop-color="#3d3d2a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3b899"/>
      <stop offset="100%" stop-color="#e8dcc4"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ebd8b7"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glowing ring -->
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="#a3b899" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Warm Sprout & Heart Combo Icon -->
  <g transform="translate(64, 66)">
    <!-- Sprout Leaves Behind -->
    <path d="M-22,-18 C-32,-36 -12,-48 0,-34 C-4,-24 -12,-18 -22,-18 Z" fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M22,-18 C32,-36 12,-48 0,-34 C4,-24 12,-18 22,-18 Z" fill="url(#leafGrad)" opacity="0.9"/>
    
    <!-- Central Warm Heart Shape -->
    <path d="M0,24 C-26,4 -36,-10 -36,-24 C-36,-36 -24,-44 -12,-44 C-4,-44 0,-38 0,-38 C0,-38 4,-44 12,-44 C24,-44 36,-36 36,-24 C36,-10 26,4 0,24 Z" 
          fill="url(#heartGrad)" 
          filter="drop-shadow(0 4px 8px rgba(0,0,0,0.25))"/>
          
    <!-- Sparkle dot inside heart -->
    <circle cx="0" cy="-22" r="5" fill="#5a5a40" opacity="0.85"/>
    <circle cx="-10" cy="-28" r="2.5" fill="#5a5a40" opacity="0.6"/>
    <circle cx="10" cy="-28" r="2.5" fill="#5a5a40" opacity="0.6"/>
  </g>
</svg>
